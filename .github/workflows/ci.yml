name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nodejs:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: nodejs } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: nodejs/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: python } }
    strategy:
      matrix: { python-version: ["3.10", "3.13"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - run: pip install -e ".[dev]"
      - run: mypy kakaotalk_bot
      - run: pytest -q

  java:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: java } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17, cache: maven }
      - run: mvn -B test
