[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "kakaotalk-bot"
version = "0.1.0"
description = "KakaoTalk Bot API client: REST API wrapper, Gateway (WebSocket) client and webhook helpers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jade (punch5545)" }]
keywords = ["kakao", "kakaotalk", "bot", "chatbot", "gateway", "websocket"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "websockets>=12.0",
]

[project.urls]
Homepage = "https://github.com/punch5545/KakaoTalk-Bot-Wrapper/tree/main/python#readme"
Repository = "https://github.com/punch5545/KakaoTalk-Bot-Wrapper"
Issues = "https://github.com/punch5545/KakaoTalk-Bot-Wrapper/issues"
Documentation = "https://developers.kakao.com/docs/ko/bot/common"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["kakaotalk_bot"]

[tool.hatch.build.targets.sdist]
include = ["kakaotalk_bot", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
